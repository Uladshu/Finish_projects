/* Layout: left panel (species → types → dates → search → results) beside a vector map of Wrocław; on phones the map sits on top. */
:root {
  --bg: #f3f5f2; --panel: #ffffff; --ink: #1d2420; --muted: #5d6a63; --line: #dfe5e0; --chip: #edf1ee;
  --accent: #1f6f5c; --accent-ink: #ffffff;
  --lost: #d2372b; --found: #2a8a45; --seen: #0b7f95; --help: #2f63c7; --give: #8a5bc7; --hazard: #d97f00; --place: #4f5b55;
  --shadow: 0 6px 24px rgba(20, 35, 28, .14);
  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body: "Onest", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121614; --panel: #1a201d; --ink: #e8eeea; --muted: #9daaa3; --line: #2c3530; --chip: #232b27;
  --accent: #4fbf9f; --accent-ink: #0d1411;
  --lost: #ff6b5e; --found: #5fcf7c; --seen: #46c3d8; --help: #79a2ff; --give: #c39bff; --hazard: #ffb340; --place: #b5c0ba;
  --shadow: 0 6px 24px rgba(0, 0, 0, .5); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121614; --panel: #1a201d; --ink: #e8eeea; --muted: #9daaa3; --line: #2c3530; --chip: #232b27;
  --accent: #4fbf9f; --accent-ink: #0d1411;
  --lost: #ff6b5e; --found: #5fcf7c; --seen: #46c3d8; --help: #79a2ff; --give: #c39bff; --hazard: #ffb340; --place: #b5c0ba;
  --shadow: 0 6px 24px rgba(0, 0, 0, .5); color-scheme: dark; }

[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
.app { height: 100%; display: grid; grid-template-columns: minmax(340px, 420px) 1fr; }
.panel { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.head { padding-block: 14px 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; }
.brand h1 { margin: 0; margin-right: auto; font-family: var(--f-display); font-weight: 800; font-size: 18px; line-height: 1.1; }
.langs { display: flex; gap: 2px; background: var(--chip); border-radius: 999px; padding: 3px; }

const score = () => Object.entries(PR.counts).reduce((s, [k, n]) => s + (POINTS[k] || 0) * n, 0);
const levelOf = (p) => LEVELS.filter((x) => p >= x).length - 1;
try {
  const s = JSON.parse(localStorage.getItem('lapka-v2') || '{}');
  if (s.lang) lang = s.lang; if (s.pr) PR = s.pr; if (s.joined) joined = new Set(s.joined);
  (s.added || []).forEach((i) => ITEMS.push(i));
  (s.sights || []).forEach(([id, sg]) => { const it = ITEMS.find((x) => x.id === id); if (it) it.sightings.push(sg); });
} catch (e) {}
PR.medals = MEDALS.filter((m) => m.ok(PR.counts)).map((m) => m.id);
let storageWarned = false;
function save() {
  const sights = [];
  ITEMS.forEach((i) => (i.sightings || []).forEach((sg) => { if (sg.mine) sights.push([i.id, sg]); }));
  const data = { lang, pr: PR, joined: [...joined], added: ITEMS.filter((i) => i.mine), sights };
  try { localStorage.setItem('lapka-v2', JSON.stringify(data)); }
  catch (e) {
    try { // keep text, drop photos when storage is full
      const strip = (o) => ({ ...o, photos: [] });
      localStorage.setItem('lapka-v2', JSON.stringify({ ...data, added: data.added.map(strip), sights: sights.map(([id, sg]) => [id, strip(sg)]) }));
    } catch (e2) {}
    if (!storageWarned) { storageWarned = true; toast(T[lang].storageWarn); }
  }
}

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const tx = (o) => o == null ? '' : typeof o === 'string' ? o : (o[lang] || o.pl);
const minsAgo = (at) => (Date.now() - at) / 60000;
const fmtDate = (at) => new Intl.DateTimeFormat(lang === 'en' ? 'en-GB' : lang, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }).format(at);
const when = (at) => `${fmtDate(at)} · ${T[lang].ago(minsAgo(at))}`;
const dist = (a, b) => { const R = 6371000, toR = Math.PI / 180, dLat = (b.lat - a.lat) * toR, dLng = (b.lng - a.lng) * toR;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * toR) * Math.cos(b.lat * toR) * Math.sin(dLng / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };
const fmtKm = (m) => m < 1000 ? `${Math.round(m / 10) * 10} m` : `${(m / 1000).toFixed(1).replace('.', lang === 'en' ? '.' : ',')} km`;
const titleOf = (it) => {
  const t = T[lang];
  if (it.title) return tx(it.title);
  if (it.type === 'hazard') return `${t.hzs[it.hz] || t.type1.hazard}: ${it.street || ''}`;
  if (it.type === 'lost') return `${t.type1.lost}: ${it.name || t.sp1[it.species]} (${tx(it.breed) || t.sp1[it.species]})`;
  return `${t.type1[it.type]}: ${tx(it.breed) || t.sp1[it.species]}`;
};
function searchRadius(it) {
  const h = minsAgo(it.at) / 60;
  if (it.species === 'cat') return Math.min(150 + h * 25, 600);
  if (it.species === 'bird') return Math.min(500 + h * 300, 2500);
  if (it.species === 'dog') return Math.min(300 + h * 300, 3000);
  return Math.min(120 + h * 30, 500);
}

// ---------- Filtering: species first, everything else adapts ----------
function speciesMatch(it) {
  if (species === 'all') return true;
  if (it.type === 'place') return (it.for || []).includes(species);
  if (it.type === 'hazard') return species === 'dog' || species === 'cat';
  return it.species === species;
}
const periodMatch = (it) => period === 'all' || it.at == null || minsAgo(it.at) <= DATES[period] * 1440;
function queryMatch(it) {
  if (!query) return true;
  const hay = [titleOf(it), it.name, tx(it.breed), tx(it.color), tx(it.desc), it.street, tx(it.collar)].join(' ').toLowerCase();
  return query.toLowerCase().split(/\s+/).every((w) => hay.includes(w));
}

function compress(file) {
  return new Promise((res) => {
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => {
      const k = Math.min(1, 1000 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .72)); };
      img.onerror = () => res(null); img.src = r.result; };
    r.onerror = () => res(null); r.readAsDataURL(file);
  });
}

    fields += sel('nf-species', f.species + ' *', spOpts, draft.species);
    fields += ty === 'lost' ? inp('nf-name', f.name + ' *', draft.name) : sel('nf-now', f.now, t.nows, draft.now);
    fields += inp('nf-breed', f.breed, draft.breed) + inp('nf-color', f.color + (ty === 'lost' ? '' : ' *'), draft.color);
    if (ty === 'lost') fields += sel('nf-sex', f.sex, t.sexes, draft.sex) + inp('nf-age', f.age, draft.age, 'inputmode="numeric"');
    if (draft.species === 'dog') fields += sel('nf-size', f.size, t.sizes, draft.size);
    if (ty === 'lost') fields += sel('nf-chip', f.chip, t.yn, draft.chip);
    fields += inp('nf-collar', f.collar, draft.collar);
  } else if (ty === 'hazard') {
    fields += sel('nf-hz', f.hz + ' *', t.hzs, draft.hz || 'poison');
  } else {
    fields += sel('nf-species', f.species, spOpts, draft.species) + sel('nf-price', f.price, t.prices, draft.price || 'free');
    fields += inp('nf-title', f.title + ' *', draft.title, '', true);
  }
  fields += `<label class="f">${f.when[ty]} *<input id="nf-when" type="datetime-local" value="${esc(draft.whenAt || nowLocal())}" max="${nowLocal()}"></label>`;
  fields += inp('nf-street', f.street, draft.street);
  fields += area('nf-desc', (ty === 'seen' ? f.moving : f.desc) + (ty === 'lost' ? '' : ''), draft.desc);
  if (ty === 'lost') fields += area('nf-behavior', f.behavior, draft.behavior) + inp('nf-reward', f.reward, draft.reward);
  fields += photoField();
  $('modal-body').innerHTML = `<h2>${t.newTitle}</h2>
    <div><div class="lbl" style="margin-bottom:6px">${t.what}</div><div class="types">${['lost', 'found', 'seen', 'help', 'give', 'hazard'].map((k) =>
      `<button id="nt-${k}" data-nt="${k}" aria-pressed="${ty === k}" style="--c:${TYPES[k].c}">${k === 'lost' || k === 'found' ? spGlyph(draft.species) : k === 'seen' ? G.eye : G[TYPES[k].g]}${t.newT[k]}</button>`).join('')}</div></div>
    <div class="grid2">${fields}</div>
    <div class="actions" style="justify-content:flex-end"><button class="btn" id="nf-cancel">${t.cancel}</button><button class="btn primary" id="nf-next">${t.next}</button></div>`;
  $('modal').hidden = false;
}
function startReport(type) {
  draft = { type, species: species === 'all' ? 'dog' : species, photos: [] };
  openForm();
}
function validate() {
  const ty = draft.type;
  if (!draft.whenAt) return false;
  if (ty === 'lost' && !draft.name) return false;
  if ((ty === 'found' || ty === 'seen') && !draft.color && !draft.desc && !(draft.photos || []).length) return false;
  if ((ty === 'help' || ty === 'give') && !draft.title) return false;
  return true;
}
function openSighting(it) {
  const t = T[lang];
  if (!draft || draft.sightFor !== it.id) draft = { sightFor: it.id, photos: [] };
  $('modal-body').innerHTML = `<h2>${t.sightTitle}</h2><p class="count" style="margin:-4px 0 0">${esc(titleOf(it))}</p><div class="grid2">
    <label class="f">${t.f.when.seen} *<input id="nf-when" type="datetime-local" value="${esc(draft.whenAt || nowLocal())}" max="${nowLocal()}"></label>
    <label class="f">${t.f.street}<input id="nf-street" value="${esc(draft.street)}"></label>
    <label class="f full">${t.sightNote}<textarea id="nf-desc">${esc(draft.desc)}</textarea></label>${photoField()}</div>
    <div class="actions" style="justify-content:flex-end"><button class="btn" id="nf-cancel">${t.cancel}</button><button class="btn primary" id="nf-next">${t.next}</button></div>`;
  $('modal').hidden = false;
}
function onMapPick(ll) {
  if (!pick || !draft) return;
  const t = T[lang], at = draft.whenAt ? new Date(draft.whenAt).getTime() : Date.now();
  if (pick === 'sight') {
    const it = ITEMS.find((i) => i.id === draft.sightFor);
    it.sightings = it.sightings || [];
    it.sightings.push({ lat: ll.lat, lng: ll.lng, at, note: draft.desc || draft.street || '', photos: draft.photos, mine: true });
    pick = null; draft = null; setHint(''); save(); renderAll(); toast(t.seenAdded + ' ' + award('seen'));
    return;
  }
  const L = (s) => s || undefined;
  const it = { id: Date.now(), mine: true, type: draft.type, species: draft.species, name: L(draft.name), breed: L(draft.breed), sex: L(draft.sex), age: L(draft.age),
    size: L(draft.size), color: L(draft.color), collar: L(draft.collar), chip: L(draft.chip), street: L(draft.street), desc: draft.desc || '', behavior: L(draft.behavior),
    reward: L(draft.reward), now: L(draft.now), title: L(draft.title), price: L(draft.price), hz: L(draft.hz), photos: draft.photos || [],
    lat: ll.lat, lng: ll.lng, at, sightings: [], confirms: 0 };
  ITEMS.push(it); on[it.type] = true; pick = null; draft = null; setHint('');
  if (species !== 'all' && it.species && species !== it.species && ANIMAL(it.type)) species = it.species;
  save();
  const r = it.type === 'lost' ? searchRadius(it) : 1500;
  renderChrome(); select(it.id, true);
  const pts = it.type === 'seen' ? award('seen') : award('post');
  toast(t.posted(Math.round(40 + r * .12)) + ' ' + pts);
}

// ---------- Events ----------
document.addEventListener('click', async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const t = T[lang];
  if (b.dataset.l) { lang = b.dataset.l; save(); renderAll(); if (!$('modal').hidden && draft) { readForm(); draft.sightFor ? openSighting(ITEMS.find((i) => i.id === draft.sightFor)) : openForm(); } }
  else if (b.dataset.tab) { tab = b.dataset.tab; renderChrome(); renderList(); }
  else if (b.dataset.sp) { species = b.dataset.sp; if (selected && !visible().some((i) => i.id === selected)) selected = null; renderAll(); }
  else if (b.dataset.k) { on[b.dataset.k] = !on[b.dataset.k]; renderChrome(); renderList(); drawMap(); }
  else if (b.dataset.d) { period = b.dataset.d; renderAll(); }
  else if (b.dataset.id) { if (!$('modal').hidden) return; select(Number(b.dataset.id), true); }
  else if (b.id === 'lvl') { tab = 'profile'; renderChrome(); renderList(); }
  else if (b.dataset.join) { const i = Number(b.dataset.join); if (joined.has(i)) { joined.delete(i); save(); renderList(); } else { joined.add(i); renderList(); toast(award('group')); } }
  else if (b.id === 'fab-add') startReport(species === 'all' ? 'lost' : 'lost');
  else if (b.id === 'fab-seen') startReport('seen');
  else if (b.dataset.nt) { readForm(); draft.type = b.dataset.nt; openForm(); }
  else if (b.dataset.rmph) { readForm(); draft.photos.splice(Number(b.dataset.rmph), 1); draft.sightFor ? reopenSighting() : openForm(); }
  else if (b.id === 'nf-cancel') { draft = null; $('modal').hidden = true; }
  else if (b.id === 'nf-next') {
    readForm();
    if (!draft.sightFor && !validate()) { toast(t.need); return; }
    $('modal').hidden = true; pick = draft.sightFor ? 'sight' : 'new'; setHint(pick === 'sight' || draft.type === 'seen' ? t.pickSeen : t.pick);
  }
  else if (b.dataset.photo != null) { const it = ITEMS.find((i) => i.id === selected); openLightbox(it.photos, Number(b.dataset.photo)); }
  else if (b.dataset.act) {
    const it = ITEMS.find((i) => i.id === selected);
    const act = b.dataset.act;
    if (act === 'stop') { pick = null; draft = null; setHint(''); }
    else if (act === 'close') { selected = null; renderSheet(); renderList(); drawMap(); }
    else if (act === 'sight') { draft = null; openSighting(it); }
    else if (act === 'poster') openPoster(it);
    else if (act === 'confirm') { it.confirms = (it.confirms || 0) + 1; renderSheet(); toast(t.confirmed + ' ' + award('hazard')); }
    else if (act === 'reunite') { ITEMS.splice(ITEMS.indexOf(it), 1); selected = null; save(); const msg = t.reunited + ' ' + award('reunite'); renderAll(); toast(msg); }
    else if (act === 'help') toast(award('help'));
    else toast(t.msgProto);
  }
});
const reopenSighting = () => openSighting(ITEMS.find((i) => i.id === draft.sightFor));
function openPoster(it) {
  const t = T[lang];
  $('modal-body').innerHTML = `<div class="top" style="display:flex;justify-content:space-between;align-items:center"><h2>${t.posterTitle}</h2><button class="x" id="nf-cancel" aria-label="Close">×</button></div>
    <div class="poster"><div class="big">${it.type === 'lost' ? 'ZAGINĄŁ' : 'ZNALEZIONY'}</div>
      ${(it.photos || []).length ? `<img class="pic" src="${it.photos[0]}" alt="">` : `<div class="pic">${glyphFor(it)}</div>`}
      <div class="nm">${esc(it.name || tx(it.breed) || T.pl.sp1[it.species])}</div>
      <div style="font-size:14px;line-height:1.45;text-align:center">${esc([tx(it.color), tx(it.desc)].filter(Boolean).join('. '))}</div>
      <div style="font-size:13px;text-align:center"><b>${esc(it.street || '')}</b> · ${fmtDate(it.at)}${it.reward ? ` · Nagroda: ${esc(it.reward)}` : ''}</div>
      <div class="pbottom"><div>${t.posterContact}<br><b>lapka.example/z/${it.id}</b></div><div class="qr" id="qr"></div></div></div>
    <p class="note">${t.posterNote}</p>`;
  $('modal').hidden = false;
  try { new QRCode($('qr'), { text: `https://lapka.example/z/${it.id}`, width: 208, height: 208, correctLevel: QRCode.CorrectLevel.M }); } catch (e) {}
}
document.addEventListener('change', async (e) => {
  if (e.target.id === 'ph-input') {
    readForm();
    const files = [...e.target.files].slice(0, 8 - (draft.photos || []).length);
    for (const file of files) { const d = await compress(file); if (d) draft.photos.push(d); }
    draft.sightFor ? reopenSighting() : openForm();
  } else if (e.target.id === 'nf-species' && draft) { readForm(); openForm(); }
});
$('q').addEventListener('input', (e) => { query = e.target.value.trim(); renderChrome(); renderList(); drawMap(); });
$('modal').addEventListener('click', (e) => { if (e.target === $('modal')) { $('modal').hidden = true; draft = null; } });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { $('modal').hidden = true; $('lightbox').hidden = true; if (pick) { pick = null; draft = null; setHint(''); } } });

renderChrome(); renderList();
initMap();
new ResizeObserver(() => map && map.resize()).observe(document.querySelector('.mapwrap'));
</script>
