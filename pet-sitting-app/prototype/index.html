<meta charset="utf-8">
<title>Łapka Sąsiedzka</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600;800&display=swap">
<style>
/* Layout: one-screen app — panel (feed, filters, groups) beside a live district map; on phones the map sits on top. */
:root {
  --bg: #f3f5f2; --panel: #ffffff; --ink: #1d2420; --muted: #5d6a63; --line: #dfe5e0; --chip: #edf1ee;
  --accent: #1f6f5c; --accent-ink: #ffffff;
  --lost: #d2372b; --found: #2a8a45; --help: #2f63c7; --give: #8a5bc7; --hazard: #e08a00; --place: #4f5b55;
  --shadow: 0 6px 24px rgba(20, 35, 28, .14);
  --map-filter: none;
  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body: "Onest", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121614; --panel: #1a201d; --ink: #e8eeea; --muted: #9daaa3; --line: #2c3530; --chip: #232b27;
  --accent: #4fbf9f; --accent-ink: #0d1411;
  --lost: #ff6b5e; --found: #5fcf7c; --help: #79a2ff; --give: #c39bff; --hazard: #ffb340; --place: #b5c0ba;
  --shadow: 0 6px 24px rgba(0, 0, 0, .5); --map-filter: brightness(.78) contrast(1.08) saturate(.85); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121614; --panel: #1a201d; --ink: #e8eeea; --muted: #9daaa3; --line: #2c3530; --chip: #232b27;
  --accent: #4fbf9f; --accent-ink: #0d1411;
  --lost: #ff6b5e; --found: #5fcf7c; --help: #79a2ff; --give: #c39bff; --hazard: #ffb340; --place: #b5c0ba;
  --shadow: 0 6px 24px rgba(0, 0, 0, .5); --map-filter: brightness(.78) contrast(1.08) saturate(.85); color-scheme: dark; }

/* Leaflet 1.9.4 core CSS (inlined; only parts this page uses) */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent;font:inherit}
.leaflet-marker-icon,.leaflet-image-layer,.leaflet-pane>svg path{-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
.leaflet-container img.leaflet-image-layer{max-width:none!important;max-height:none!important;width:auto;padding:0}
.leaflet-container.leaflet-touch-zoom{touch-action:pan-x pan-y}.leaflet-container.leaflet-touch-drag{touch-action:none}
.leaflet-pane{z-index:400}.leaflet-overlay-pane{z-index:400}.leaflet-marker-pane{z-index:600}.leaflet-popup-pane{z-index:700}
.leaflet-pane>svg path.leaflet-interactive{pointer-events:auto}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-pan-anim .leaflet-tile,.leaflet-zoom-anim .leaflet-tile{transition:none}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-interactive{cursor:pointer}.leaflet-grab{cursor:grab}.leaflet-dragging .leaflet-grab{cursor:move}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-right .leaflet-control{float:right;margin-right:10px}.leaflet-top .leaflet-control{margin-top:10px}
.leaflet-bottom .leaflet-control{margin-bottom:0}.leaflet-left .leaflet-control{margin-left:10px}
.leaflet-bar{box-shadow:var(--shadow);border-radius:10px;overflow:hidden}
.leaflet-bar a{background:var(--panel);color:var(--ink);width:36px;height:36px;line-height:34px;display:block;text-align:center;text-decoration:none;font-size:20px;border-bottom:1px solid var(--line)}
.leaflet-bar a:last-child{border-bottom:0}
.leaflet-control-attribution{background:color-mix(in srgb,var(--panel) 85%,transparent);color:var(--muted);font-size:11px;padding:2px 6px;margin:0}
.leaflet-control-attribution a{color:var(--accent)}
.leaflet-image-layer{filter:var(--map-filter)}

/* App */
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; overflow: hidden; }
.app { height: 100%; display: grid; grid-template-columns: minmax(340px, 410px) 1fr; }
.panel { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.panel-head { padding-block: 16px 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; display: grid; gap: 12px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 19px; letter-spacing: -.01em; line-height: 1.1; }
.brand small { display: block; font-family: var(--f-body); font-weight: 500; font-size: 12px; color: var(--muted); letter-spacing: .02em; margin-top: 3px; }
.langs { display: flex; gap: 2px; background: var(--chip); border-radius: 999px; padding: 3px; }
.langs button { border: 0; background: transparent; color: var(--muted); font: 600 12px var(--f-body); padding: 5px 9px; border-radius: 999px; cursor: pointer; }
.langs button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.tabs { display: flex; gap: 6px; }
.tabs button { flex: 1; border: 1px solid var(--line); background: transparent; color: var(--muted); font: 600 14px var(--f-body); padding: 8px; border-radius: 10px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: 500 13px var(--f-body); padding: 5px 10px 5px 7px; border-radius: 999px; cursor: pointer; }
.chip .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.chip .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="false"] { opacity: .45; }
.sample { font-size: 12px; color: var(--muted); }
.sample b { color: var(--ink); font-weight: 600; }
.scroll { overflow-y: auto; min-height: 0; flex: 1; padding-block: 8px 96px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; }
.item { display: grid; grid-template-columns: 40px 1fr; gap: 12px; padding: 12px 8px; border-radius: 12px; cursor: pointer; border: 0; background: transparent; width: 100%; text-align: left; color: inherit; font: inherit; }
.item:hover, .item.on { background: var(--chip); }
.item .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--c); color: #fff; }
.item .ic svg { width: 22px; height: 22px; fill: currentColor; }
.item .kind { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--c); }
.item h3 { margin: 2px 0 3px; font-size: 15px; font-weight: 600; line-height: 1.3; text-wrap: balance; }
.item p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.4; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 6px; font-size: 12px; color: var(--muted); }
.badge { display: inline-block; padding: 1px 7px; border-radius: 6px; background: var(--chip); color: var(--ink); font-size: 12px; font-weight: 500; }
.group { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 12px 8px; border-bottom: 1px solid var(--line); }
.group .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--chip); color: var(--accent); }
.group .ic svg { width: 22px; height: 22px; fill: currentColor; }
.group h3 { margin: 0; font-size: 15px; font-weight: 600; }
.group p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.btn { border: 0; border-radius: 10px; font: 600 14px var(--f-body); padding: 10px 14px; cursor: pointer; background: var(--chip); color: var(--ink); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.danger { background: var(--lost); color: #fff; }
.btn:focus-visible, .chip:focus-visible, .item:focus-visible, .tabs button:focus-visible, .langs button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.mapwrap { position: relative; min-width: 0; min-height: 0; }
#map { position: absolute; inset: 0; background: var(--bg); }
.fab { position: absolute; z-index: 1100; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 999px; padding: 14px 20px; background: var(--lost); color: #fff; font: 700 15px var(--f-body); box-shadow: var(--shadow); cursor: pointer; }
.fab svg { width: 18px; height: 18px; fill: currentColor; }
.hint { position: absolute; z-index: 1100; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; box-shadow: var(--shadow); max-width: calc(100% - 32px); text-align: center; }

/* Pins */
.pin { width: 34px; height: 34px; border-radius: 50% 50% 50% 4px; transform: rotate(-45deg); background: var(--c); display: grid; place-items: center; box-shadow: 0 3px 10px rgba(0,0,0,.3); border: 2px solid #fff; }
.pin svg { width: 18px; height: 18px; fill: #fff; transform: rotate(45deg); }
.pin.sel { outline: 3px solid var(--ink); outline-offset: 2px; }
.pin.place { border-radius: 10px; transform: none; width: 28px; height: 28px; }
.pin.place svg { transform: none; width: 16px; height: 16px; }
.sight { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 3px solid var(--lost); box-shadow: 0 1px 4px rgba(0,0,0,.35); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c) 60%, transparent); } 100% { box-shadow: 0 0 0 18px transparent; } }
.pin.fresh { animation: pulse 1.8s ease-out infinite; }
@media (prefers-reduced-motion: reduce) { .pin.fresh { animation: none; } }

/* Detail sheet */
.sheet { position: absolute; z-index: 1150; left: calc(16px + env(safe-area-inset-left, 0px)); top: calc(16px + env(safe-area-inset-top, 0px)); width: min(380px, calc(100% - 32px)); max-height: calc(100% - 110px); overflow-y: auto; background: var(--panel); border-radius: 16px; box-shadow: var(--shadow); padding: 18px; display: grid; gap: 12px; }
.sheet .top { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
.sheet h2 { margin: 2px 0 0; font-family: var(--f-display); font-weight: 600; font-size: 18px; line-height: 1.25; text-wrap: balance; }
.sheet p { margin: 0; line-height: 1.5; }
.x { border: 0; background: var(--chip); color: var(--ink); width: 32px; height: 32px; border-radius: 50%; font-size: 18px; cursor: pointer; flex: none; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 13px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; font-weight: 500; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.note { font-size: 12px; color: var(--muted); line-height: 1.45; background: var(--chip); padding: 10px 12px; border-radius: 10px; }

/* Modal */
.backdrop { position: fixed; inset: 0; z-index: 2000; background: rgba(10, 16, 13, .55); display: grid; place-items: center; padding: 16px; }
.modal { background: var(--panel); color: var(--ink); border-radius: 18px; width: min(460px, 100%); max-height: calc(100% - 32px); overflow-y: auto; padding: 20px; display: grid; gap: 14px; box-shadow: var(--shadow); }
.modal h2 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 18px; }
.types { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.types button { border: 2px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 12px; padding: 10px; font: 600 13px var(--f-body); display: flex; align-items: center; gap: 8px; cursor: pointer; text-align: left; }
.types button svg { width: 18px; height: 18px; fill: var(--c); flex: none; }
.types button[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 10%, var(--panel)); }
label.f { display: grid; gap: 5px; font-size: 13px; font-weight: 600; color: var(--muted); }
label.f input, label.f select, label.f textarea { font: 400 15px var(--f-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; }
label.f textarea { min-height: 70px; resize: vertical; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* Poster */
.poster { background: #fff; color: #111; border-radius: 6px; padding: 20px; display: grid; gap: 10px; border: 1px solid #ddd; }
.poster .big { font-family: var(--f-display); font-weight: 800; font-size: 34px; letter-spacing: .02em; color: #c62d22; text-align: center; line-height: 1; }
.poster .pic { height: 120px; border-radius: 6px; background: #f1ece6; display: grid; place-items: center; color: #b8aa9a; }
.poster .pic svg { width: 64px; height: 64px; fill: currentColor; }
.poster .nm { font-family: var(--f-display); font-weight: 600; font-size: 22px; text-align: center; }
.poster .bottom { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; font-size: 13px; line-height: 1.4; }
.poster .qr { background: #fff; padding: 4px; }
.poster .qr img, .poster .qr canvas { display: block; width: 104px; height: 104px; }

/* Profile & gamification */
.lvl { border: 0; display: inline-flex; align-items: center; gap: 6px; background: color-mix(in srgb, var(--accent) 14%, var(--panel)); color: var(--ink); font: 600 12px var(--f-body); padding: 5px 10px 5px 6px; border-radius: 999px; cursor: pointer; font-variant-numeric: tabular-nums; white-space: nowrap; flex: none; }
.lvl b { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 11px; }
.prof { display: grid; gap: 14px; padding: 8px 4px; }
.me { display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: center; }
.me .av { width: 56px; height: 56px; border-radius: 16px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 22px; }
.me h3 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 16px; }
.me p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.bar { height: 10px; border-radius: 999px; background: var(--chip); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s; }
.barlbl { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 5px; font-variant-numeric: tabular-nums; }
.sec { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 6px 0 -4px; }
.medals { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.medal { border: 1px solid var(--line); border-radius: 14px; padding: 10px 8px; display: grid; justify-items: center; gap: 4px; text-align: center; }
.medal .m { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--c); color: #fff; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); }
.medal .m svg { width: 20px; height: 20px; fill: currentColor; }
.medal b { font-size: 12px; line-height: 1.2; }
.medal span { font-size: 11px; color: var(--muted); line-height: 1.3; }
.medal.locked .m { background: var(--chip); color: var(--muted); box-shadow: none; }
.medal.locked b { color: var(--muted); }
.earn { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 13px; }
.earn span:nth-child(even) { font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; text-align: right; }
.rank { display: grid; grid-template-columns: 22px 1fr auto; gap: 6px 10px; font-size: 13px; align-items: center; font-variant-numeric: tabular-nums; }
.rank .me-row { font-weight: 700; color: var(--accent); }
.toast { position: fixed; z-index: 3000; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 12px 18px; border-radius: 12px; font-weight: 500; box-shadow: var(--shadow); max-width: calc(100% - 32px); }

@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 52% 48%; }
  .mapwrap { grid-row: 1; } .panel { grid-row: 2; border-right: 0; border-top: 1px solid var(--line); }
  .panel-head { padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .scroll { padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: 24px; }
  .fab { bottom: 14px; padding: 12px 16px; }
  .sheet { top: auto; bottom: 12px; max-height: 78%; padding: 14px; gap: 10px; }
}
</style>

<div class="app">
  <aside class="panel">
    <div class="panel-head">
      <div class="brand">
        <h1>Łapka Sąsiedzka<small id="t-sub"></small></h1>
        <button class="lvl" id="lvl"></button>
        <div class="langs" role="group" aria-label="Language">
          <button id="lang-pl" data-l="pl">PL</button><button id="lang-ru" data-l="ru">RU</button><button id="lang-en" data-l="en">EN</button>
        </div>
      </div>
      <div class="tabs" role="tablist">
        <button id="tab-feed" role="tab" data-tab="feed"></button>
        <button id="tab-groups" role="tab" data-tab="groups"></button>
        <button id="tab-profile" role="tab" data-tab="profile"></button>
      </div>
      <div class="chips" id="chips"></div>
      <div class="sample" id="t-sample"></div>
    </div>
    <div class="scroll" id="list"></div>
  </aside>
  <main class="mapwrap">
    <div id="map" aria-label="Map"></div>
    <div class="hint" id="hint" hidden></div>
    <div class="sheet" id="sheet" hidden></div>
    <button class="fab" id="fab"></button>
  </main>
</div>
<div class="backdrop" id="modal" hidden><div class="modal" id="modal-body"></div></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const G = {

};
const TYPES = {
  lost:   { c: 'var(--lost)',   g: 'paw'   },
  found:  { c: 'var(--found)',  g: 'eye'   },

let lang = 'pl', tab = 'feed', selected = null, pickMode = null, draft = null;
const on = { lost: true, found: true, help: true, give: true, hazard: true, place: true };
let joined = new Set([0]);
// Gamification: points ("paws") only for confirmed actions; example starting profile
const POINTS = { seen: 10, help: 30, reunite: 100, hazard: 5, post: 5, group: 2, verify: 20 };
const LEVELS = [0, 50, 150, 350, 700, 1500];
let G8 = { counts: { seen: 2, help: 1, hazard: 1, post: 1, group: 1, verify: 1, reunite: 0 }, history: ['verify', 'group', 'post', 'seen', 'hazard', 'seen', 'help'], medals: [] };
const MEDALS = [
  { id: 'first', g: 'paw', c: 'var(--accent)', ok: (c) => true },
  { id: 'eagle', g: 'eye', c: 'var(--lost)', ok: (c) => c.seen >= 3 },
  { id: 'helper', g: 'heart', c: 'var(--help)', ok: (c) => c.help >= 2 },
  { id: 'guard', g: 'warn', c: 'var(--hazard)', ok: (c) => c.hazard >= 3 },
  { id: 'social', g: 'tree', c: 'var(--found)', ok: (c) => joined.size >= 3 },
  { id: 'reporter', g: 'box', c: 'var(--give)', ok: (c) => c.post >= 3 },
  { id: 'aqua', g: 'fish', c: 'var(--help)', ok: (c) => [0, 1, 2].every((i) => joined.has(i)) },
  { id: 'hero', g: 'feather', c: 'var(--lost)', ok: (c) => c.reunite >= 1 }
];
const score = () => Object.entries(G8.counts).reduce((s, [k, n]) => s + (POINTS[k] || 0) * n, 0);
const levelOf = (p) => LEVELS.filter((x) => p >= x).length - 1;
try { const s = JSON.parse(localStorage.getItem('lapka-state') || '{}'); if (s.lang) lang = s.lang; (s.added || []).forEach((i) => ITEMS.push(i)); if (s.g8) G8 = s.g8; if (s.joined) joined = new Set(s.joined); } catch (e) {}
G8.medals = MEDALS.filter((m) => m.ok(G8.counts)).map((m) => m.id);
const save = () => { try { localStorage.setItem('lapka-state', JSON.stringify({ lang, added: ITEMS.filter((i) => i.mine), g8: G8, joined: [...joined] })); } catch (e) {} };
function award(act) {
  const t = T[lang], before = levelOf(score());
  if (act) { G8.counts[act] = (G8.counts[act] || 0) + 1; G8.history.push(act); }
  const msgs = act ? [t.gained(POINTS[act])] : [];
  MEDALS.forEach((m) => { if (!G8.medals.includes(m.id) && m.ok(G8.counts)) { G8.medals.push(m.id); msgs.push(t.newMedal(t.medals[m.id][0])); } });
  const after = levelOf(score());
  if (after > before) msgs.push(t.levelUp(t.levels[after]));
  save(); renderChrome();
  if (tab === 'profile') renderList();
  return msgs.join(' · ');
}
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// Search area grows with time; cats stay close to home
function searchRadius(it) {
  const h = it.min / 60;
  if (it.species === 'cat') return Math.min(150 + h * 25, 600);
  if (it.species === 'bird') return Math.min(500 + h * 300, 2500);
  if (it.species === 'dog') return Math.min(300 + h * 300, 3000);
  return Math.min(200 + h * 50, 800);
}
const fmtKm = (m) => m < 1000 ? `${Math.round(m / 10) * 10} m` : `${(m / 1000).toFixed(1).replace('.', lang === 'en' ? '.' : ',')} km`;

// Map
// city.jpg: whole Wrocław at OSM zoom 14; map.jpg: sharper zoom-16 detail of Ołbin–Biskupin on top
const CB = { north: 51.2206474303833, west: 16.787109375, south: 51.027576337802415, east: 17.1826171875 };
const B = { north: 51.131107637580136, west: 17.0343017578125, south: 51.093173060268896, east: 17.1112060546875 };

const bounds = L.latLngBounds([B.south, B.west], [B.north, B.east]);

  .setView([51.112, 17.020], 12);
L.imageOverlay('city.jpg', cityBounds).addTo(map);

map.attributionControl.setPrefix('').addAttribution('© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors');

const layer = L.layerGroup().addTo(map);

function pinIcon(it) {
  const t = TYPES[it.type];
  const g = it.type === 'place' ? (it.kind === 'park' ? 'tree' : 'cross') : t.g;
  const fresh = (it.type === 'lost' || it.type === 'hazard') && it.min < 240;
  const cls = `pin${it.type === 'place' ? ' place' : ''}${fresh ? ' fresh' : ''}${selected === it.id ? ' sel' : ''}`;
  const size = it.type === 'place' ? 28 : 34;
  return L.divIcon({ className: '', html: `<div class="${cls}" style="--c:${t.c}">${G[g]}</div>`, iconSize: [size, size], iconAnchor: it.type === 'place' ? [14, 14] : [17, 34] });
}

function drawMap() {
  layer.clearLayers();
  const css = getComputedStyle(document.documentElement);
  const col = (k) => css.getPropertyValue('--' + k).trim();
  ITEMS.filter((i) => on[i.type]).forEach((it) => {
    if (it.type === 'lost') {
      const r = searchRadius(it);
      L.circle([it.lat, it.lng], { radius: r, color: col('lost'), weight: selected === it.id ? 3 : 1.5, dashArray: '6 6', fillColor: col('lost'), fillOpacity: selected === it.id ? .18 : .09, interactive: false }).addTo(layer);
      L.circle([it.lat, it.lng], { radius: r * .45, stroke: false, fillColor: col('lost'), fillOpacity: .1, interactive: false }).addTo(layer);
      (it.sightings || []).forEach((s) => {
        L.polyline([[it.lat, it.lng], [s.lat, s.lng]], { color: col('lost'), weight: 2, opacity: .6, dashArray: '2 6', interactive: false }).addTo(layer);
        L.marker([s.lat, s.lng], { icon: L.divIcon({ className: '', html: '<div class="sight"></div>', iconSize: [14, 14], iconAnchor: [7, 7] }) })
          .on('click', () => select(it.id)).addTo(layer);
      });
    }
    if (it.type === 'hazard') {
      L.circle([it.lat, it.lng], { radius: 160, color: col('hazard'), weight: 2, fillColor: col('hazard'), fillOpacity: .2, interactive: false }).addTo(layer);
    }
    L.marker([it.lat, it.lng], { icon: pinIcon(it), keyboard: true, title: tx(it.title) }).on('click', () => select(it.id)).addTo(layer);
  });
}

// Panel
function renderChrome() {
  const t = T[lang];
  document.documentElement.lang = lang;
  ['pl', 'ru', 'en'].forEach((l) => $('lang-' + l).setAttribute('aria-pressed', String(l === lang)));
  $('t-sub').textContent = t.sub;
  $('t-sample').innerHTML = t.sample;
  $('tab-feed').textContent = t.feed; $('tab-groups').textContent = t.groups;
  $('tab-profile').textContent = t.profile;
  ['feed', 'groups', 'profile'].forEach((k) => $('tab-' + k).setAttribute('aria-selected', String(tab === k)));
  const p = score(), lv = levelOf(p);
  $('lvl').innerHTML = `<b>${lv + 1}</b>${p} ${t.pts}`;
  $('lvl').title = t.levels[lv];
  $('fab').innerHTML = G.plus + t.fab;
  $('chips').hidden = tab !== 'feed';
  $('chips').innerHTML = Object.keys(TYPES).map((k) => `<button class="chip" id="chip-${k}" data-k="${k}" aria-pressed="${on[k]}" style="--c:${TYPES[k].c}"><span class="dot"></span>${t.chips[k]} <span class="n">${ITEMS.filter((i) => i.type === k).length}</span></button>`).join('');
}

function renderList() {
  const t = T[lang];
  if (tab === 'profile') {
    const p = score(), lv = levelOf(p), next = LEVELS[lv + 1];
    const pct = next ? Math.round((p - LEVELS[lv]) / (next - LEVELS[lv]) * 100) : 100;
    const ranks = [['Szczytniki / Zalesie', 1840 + p], ['Krzyki', 1620], ['Biskupin', 1390], ['Kozanów', 1210], ['Ołbin', 980], ['Psie Pole', 760]].sort((a, b) => b[1] - a[1]);
    $('list').innerHTML = `<div class="prof">
      <div class="me"><div class="av">A</div><div><h3>Ania K. · ${t.levels[lv]}</h3><p>${t.district} · ${p} ${t.pts}</p></div></div>
      <div><div class="bar"><i style="width:${pct}%"></i></div><div class="barlbl"><span>${t.lvlShort} ${lv + 1}</span><span>${next ? t.toNext(next - p, t.levels[lv + 1]) : t.maxLvl}</span></div></div>
      <p class="sample">${t.demo}</p>
      <div class="sec">${t.medalsT} · ${G8.medals.length}/${MEDALS.length}</div>
      <div class="medals">${MEDALS.map((m) => `<div class="medal${G8.medals.includes(m.id) ? '' : ' locked'}" style="--c:${m.c}"><div class="m">${G[m.g]}</div><b>${t.medals[m.id][0]}</b><span>${t.medals[m.id][1]}</span></div>`).join('')}</div>
      <div class="sec">${t.howT}</div>
      <div class="earn">${['reunite', 'help', 'verify', 'seen', 'hazard', 'post', 'group'].map((k) => `<span>${t.acts[k]}</span><span>+${POINTS[k]}</span>`).join('')}</div>
      <p class="note">${t.rule}</p>
      <div class="sec">${t.rankT}</div>
      <div class="rank">${ranks.map(([d, n], i) => `<span>${i + 1}.</span><span${d.startsWith('Szczytniki') ? ' class="me-row"' : ''}>${d}${d.startsWith('Szczytniki') ? ` · ${t.you}` : ''}</span><span>${n}</span>`).join('')}</div>
      <div class="sec">${t.recentT}</div>
      <div class="earn">${G8.history.slice(-5).reverse().map((k) => `<span>${t.acts[k]}</span><span>+${POINTS[k]}</span>`).join('')}</div>
    </div>`;
    return;
  }
  if (tab === 'groups') {
    $('list').innerHTML = `<p class="sample" style="margin:8px 8px 4px">${t.groupsNote}</p>` + GROUPS.map((g, i) => `
      <div class="group"><div class="ic">${G[g.g]}</div><div><h3>${tx(g.name)}</h3><p>${g.n + (joined.has(i) ? 1 : 0)} ${t.members} · ${tx(g.d)}</p></div>
      <button class="btn${joined.has(i) ? '' : ' primary'}" data-join="${i}">${joined.has(i) ? t.joined : t.join}</button></div>`).join('');
    return;
  }
  const order = { lost: 0, hazard: 1, found: 2, help: 3, give: 4, place: 5 };
  const rows = ITEMS.filter((i) => on[i.type]).sort((a, b) => (order[a.type] - order[b.type]) || ((a.min ?? 1e9) - (b.min ?? 1e9)));
  $('list').innerHTML = rows.map((it) => {
    const ty = TYPES[it.type];
    const g = it.type === 'place' ? (it.kind === 'park' ? 'tree' : 'cross') : ty.g;
    const meta = [];
    if (it.min != null) meta.push(t.ago(it.min));
    if (it.species && it.type !== 'hazard') meta.push(`<span class="badge">${t.sp[it.species]}</span>`);
    if (it.type === 'lost') meta.push(`${t.area}: ${fmtKm(searchRadius(it))}`);
    if (it.type === 'hazard') meta.push(`✓ ${it.confirms}`);
    if (it.price) meta.push(`<span class="badge">${t[it.price]}</span>`);
    return `<button class="item${selected === it.id ? ' on' : ''}" data-id="${it.id}" style="--c:${ty.c}">
      <span class="ic">${G[g]}</span>
      <span><span class="kind">${t.types[it.type]}</span><h3>${esc(tx(it.title))}</h3><p>${esc(tx(it.desc))}</p><span class="meta">${meta.join('<span aria-hidden="true">·</span>')}</span></span></button>`;
  }).join('');
}

function renderSheet() {
  const it = ITEMS.find((i) => i.id === selected);
  if (!it) { $('sheet').hidden = true; return; }
  const t = T[lang], ty = TYPES[it.type];
  const facts = [];
  if (it.species && it.type !== 'hazard') facts.push([t.species, t.sp[it.species]]);
  if (it.min != null) facts.push([t.when, t.ago(it.min)]);
  if (it.type === 'lost') facts.push([t.area, `${t.radius} ${fmtKm(searchRadius(it))}`]);
  if (it.type === 'lost' && it.sightings?.length) facts.push([t.seen, `${it.sightings.length} ${t.times}`]);
  if (it.price) facts.push([t.price, t[it.price]]);
  const acts = {
    lost: `<button class="btn danger" data-act="seen">${t.btnSeen}</button><button class="btn" data-act="poster">${t.btnPoster}</button><button class="btn" data-act="msg">${t.btnWrite}</button><button class="btn primary" data-act="reunite">${t.btnReunite}</button>`,
    found: `<button class="btn primary" data-act="msg">${t.btnWrite}</button><button class="btn" data-act="poster">${t.btnPoster}</button>`,
    help: `<button class="btn primary" data-act="msg">${t.btnHelp}</button>`,
    give: `<button class="btn primary" data-act="msg">${t.btnWrite}</button>`,
    hazard: `<button class="btn" data-act="confirm">${t.btnConfirm}</button>`,
    place: `<button class="btn" data-act="msg">${t.btnRoute}</button>`
  }[it.type];
  $('sheet').innerHTML = `
    <div class="top"><div><div class="kind" style="color:${ty.c};font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase">${t.types[it.type]}</div><h2>${esc(tx(it.title))}</h2></div>
    <button class="x" data-act="close" aria-label="Close">×</button></div>
    <p>${esc(tx(it.desc))}</p>
    ${facts.length ? `<dl class="facts">${facts.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl>` : ''}
    ${it.type === 'lost' ? `<div class="note">${t.areaNote(it.species)}</div>` : ''}
    <div class="actions">${acts}</div>`;
  $('sheet').hidden = false;
}

function select(id, fly) {
  selected = id;
  const it = ITEMS.find((i) => i.id === id);
  if (it && fly) map.flyTo([it.lat, it.lng], Math.max(map.getZoom(), it.type === 'lost' ? 15 : 16), { duration: .6 });
  renderList(); renderSheet(); drawMap();
}
function renderAll() { renderChrome(); renderList(); renderSheet(); drawMap(); }

function toast(msg) {
  const el = $('toast'); el.textContent = msg; el.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 3600);
}
function setHint(msg) { $('hint').textContent = msg || ''; $('hint').hidden = !msg; }

// Poster
function openPoster(it) {
  const t = T[lang];
  $('modal-body').innerHTML = `<div class="top" style="display:flex;justify-content:space-between;align-items:center"><h2>${t.posterTitle}</h2><button class="x" id="poster-close" aria-label="Close">×</button></div>
    <div class="poster"><div class="big">${it.type === 'lost' ? t.lostBig : t.foundBig}</div>
      <div class="pic">${G[it.species === 'fish' ? 'fish' : it.species === 'bird' ? 'feather' : 'paw']}</div>
      <div class="nm">${esc(it.name || T.pl.sp[it.species])}</div>
      <div style="font-size:14px;line-height:1.45;text-align:center">${esc(tx(it.desc))}</div>
      <div class="bottom"><div>${t.posterContact}<br><b>lapka.example/z/${it.id}</b></div><div class="qr" id="qr"></div></div></div>
    <p class="note">${t.posterNote}</p>`;
  $('modal').hidden = false;
  try { new QRCode($('qr'), { text: `https://lapka.example/z/${it.id}`, width: 208, height: 208, correctLevel: QRCode.CorrectLevel.M }); } catch (e) {}
  $('poster-close').onclick = () => { $('modal').hidden = true; };
}

// New post
function openNew() {
  const t = T[lang];
  draft = draft || { type: 'lost', species: 'dog', price: 'free' };
  const typeBtns = ['lost', 'found', 'help', 'give', 'hazard'].map((k) => `<button id="nt-${k}" data-nt="${k}" aria-pressed="${draft.type === k}" style="--c:${TYPES[k].c}">${G[TYPES[k].g]}${t.types[k]}</button>`).join('');
  $('modal-body').innerHTML = `<h2>${t.newTitle}</h2>
    <div><div class="sample" style="margin-bottom:6px">${t.what}</div><div class="types">${typeBtns}</div></div>
    <div class="row2">
      <label class="f">${t.spSel}<select id="nf-species">${Object.keys(t.sp).map((s) => `<option value="${s}"${draft.species === s ? ' selected' : ''}>${t.sp[s]}</option>`).join('')}</select></label>
      <label class="f" ${draft.type === 'help' || draft.type === 'give' ? '' : 'hidden'}>${t.priceSel}<select id="nf-price"><option value="free">${t.free}</option><option value="nego">${t.nego}</option><option value="paid">${t.paid}</option></select></label>
    </div>
    <label class="f">${t.name}<input id="nf-title" value="${esc(draft.title || '')}" placeholder="${draft.type === 'lost' ? 'Burek' : ''}"></label>
    <label class="f">${t.desc}<textarea id="nf-desc">${esc(draft.desc || '')}</textarea></label>
    <div class="actions" style="justify-content:flex-end"><button class="btn" id="nf-cancel">${t.cancel}</button><button class="btn primary" id="nf-next">${t.next}</button></div>`;
  $('modal').hidden = false;
  if ($('nf-price')) $('nf-price').value = draft.price;
  const keep = () => { draft.species = $('nf-species').value; draft.price = $('nf-price').value; draft.title = $('nf-title').value.trim(); draft.desc = $('nf-desc').value.trim(); };
  $('modal-body').querySelectorAll('[data-nt]').forEach((b) => b.onclick = () => { keep(); draft.type = b.dataset.nt; openNew(); });
  $('nf-cancel').onclick = () => { draft = null; $('modal').hidden = true; };
  $('nf-next').onclick = () => {
    keep();
    if (!draft.title) { toast(t.needTitle); $('nf-title').focus(); return; }
    $('modal').hidden = true; pickMode = 'new'; setHint(t.pickPlace);
  };
}

map.on('click', (e) => {
  const t = T[lang];
  if (pickMode === 'new' && draft) {
    const it = { id: Date.now(), mine: true, type: draft.type, species: draft.species, name: draft.type === 'lost' ? draft.title : '',
      lat: e.latlng.lat, lng: e.latlng.lng, min: 1, title: draft.title, desc: draft.desc || '—', sightings: [], confirms: 0,
      price: (draft.type === 'help' || draft.type === 'give') ? draft.price : undefined };
    ITEMS.push(it); on[it.type] = true; draft = null; pickMode = null; setHint(''); save();
    const r = it.type === 'lost' ? searchRadius(it) : 1500;
    renderChrome(); select(it.id, true);
    toast(t.notify(Math.round(40 + r * .12)) + ' ' + award('post'));
  } else if (pickMode === 'seen' && selected) {
    const it = ITEMS.find((i) => i.id === selected);
    it.sightings = it.sightings || []; it.sightings.push({ lat: e.latlng.lat, lng: e.latlng.lng, min: 0 });
    pickMode = null; setHint(''); save(); renderSheet(); renderList(); drawMap(); toast(t.seenAdded + ' ' + award('seen'));
  }
});

document.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const t = T[lang];
  if (b.dataset.l) { lang = b.dataset.l; save(); renderAll(); }
  else if (b.dataset.tab) { tab = b.dataset.tab; renderChrome(); renderList(); }
  else if (b.dataset.k) { on[b.dataset.k] = !on[b.dataset.k]; renderChrome(); renderList(); drawMap(); }
  else if (b.dataset.id) select(Number(b.dataset.id), true);
  else if (b.id === 'lvl') { tab = 'profile'; renderChrome(); renderList(); }
  else if (b.dataset.join) {
    const i = Number(b.dataset.join);
    if (joined.has(i)) { joined.delete(i); save(); renderList(); }
    else { joined.add(i); renderList(); toast(award('group')); }
  }
  else if (b.id === 'fab') { draft = null; openNew(); }
  else if (b.dataset.act) {
    const it = ITEMS.find((i) => i.id === selected);
    if (b.dataset.act === 'close') { selected = null; pickMode = null; setHint(''); renderSheet(); renderList(); drawMap(); }
    else if (b.dataset.act === 'seen') { pickMode = 'seen'; setHint(t.pickSeen); }
    else if (b.dataset.act === 'poster') openPoster(it);
    else if (b.dataset.act === 'confirm') { it.confirms = (it.confirms || 0) + 1; renderSheet(); renderList(); toast(t.confirmed + ' ' + award('hazard')); }
    else if (b.dataset.act === 'reunite') {
      ITEMS.splice(ITEMS.indexOf(it), 1); selected = null; save();
      const msg = t.reunited + ' ' + award('reunite'); renderAll(); toast(msg);
    }
    else if (b.dataset.act === 'msg' && it.type === 'help') toast(t.helpSent + ' ' + award('help'));
    else if (b.dataset.act === 'msg') toast(t.msgProto);
  }
});
$('modal').addEventListener('click', (e) => { if (e.target === $('modal')) $('modal').hidden = true; });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { $('modal').hidden = true; pickMode = null; setHint(''); } });
new ResizeObserver(() => map.invalidateSize()).observe(document.querySelector('.mapwrap'));
renderAll();
</script>
